<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E24" />
      <stop offset="100%" stop-color="#0E0E12" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#darkBg)" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="2"/>
  <g filter="url(#shadow)">
    <!-- Amber Hexagonal Gem / Spark -->
    <path d="M60 22 L88 38 L88 72 L60 88 L32 72 L32 38 Z" fill="url(#amberGlow)" />
    <!-- Inner facets -->
    <path d="M60 22 L60 55 L32 38 Z" fill="#FEF3C7" fill-opacity="0.6"/>
    <path d="M60 22 L88 38 L60 55 Z" fill="#FDE68A" fill-opacity="0.4"/>
    <path d="M88 38 L88 72 L60 55 Z" fill="#D97706" fill-opacity="0.5"/>
    <path d="M88 72 L60 88 L60 55 Z" fill="#B45309" fill-opacity="0.7"/>
    <path d="M60 88 L32 72 L60 55 Z" fill="#92400E" fill-opacity="0.6"/>
    <path d="M32 72 L32 38 L60 55 Z" fill="#F59E0B" fill-opacity="0.5"/>
    <!-- Central Core Energy -->
    <circle cx="60" cy="55" r="7" fill="#FFFFFF" opacity="0.9"/>
  </g>
  <!-- Orbiting Nodes -->
  <circle cx="28" cy="85" r="3.5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="92" cy="85" r="3.5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="60" cy="100" r="3" fill="#FDE68A" opacity="0.9"/>
</svg>

